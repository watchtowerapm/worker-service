root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/worker ./cmd/worker"
  bin = "./tmp/worker"
  full_bin = "./tmp/worker"
  include_ext = ["go"]
  exclude_dir = ["docker", "vendor"]
  delay = 500
  kill_delay = "1s"
  rerun = false

[log]
  time = true
  main_only = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
