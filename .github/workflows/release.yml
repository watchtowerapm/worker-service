name: Release

on:
  push:
    branches: ["1.x"]    # push to 1.x  → image tagged :edge
    tags: ["v*.*.*"]      # version tag  → image tagged :v1.2.3, :1.2, :1

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # ghcr.io/watchtowerapm/worker-service

jobs:
  # ---------------------------------------------------------------------------
  # Build one image per architecture on a native runner (no QEMU emulation).
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch:   amd64
            runner: ubuntu-24.04
          - arch:   arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          platforms: linux/${{ matrix.arch }}
          push: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to:   type=gha,scope=build-${{ matrix.arch }},mode=max
          provenance: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Merge both single-arch digests into a single fat manifest and apply tags.
  # ---------------------------------------------------------------------------
  merge:
    name: Merge manifest & tag
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download digest artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=1.x
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=worker-service
            org.opencontainers.image.description=Watchtower telemetry worker service

      - name: Create and push fat manifest
        working-directory: /tmp/digests
        run: |
          SOURCES=$(for digest in *; do echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:${digest}"; done | tr '\n' ' ')
          TAGS=$(echo "${{ steps.meta.outputs.tags }}" | sed 's|^|-t |' | tr '\n' ' ')
          docker buildx imagetools create $TAGS $SOURCES

      - name: Inspect final manifest
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Docker image

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ```

            Supports `linux/amd64` and `linux/arm64` — Docker will pull the correct arch automatically.
